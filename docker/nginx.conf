# Hardened nginx server block for the Stellar Pay static SPA.
# Served by nginxinc/nginx-unprivileged on port 8080 as a non-root user.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hide the nginx version in error pages and the Server header.
    server_tokens off;

    # Security headers for any response served directly from this block.
    include /etc/nginx/security-headers.conf;

    # ----- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ----- Caching ------------------------------------------------------------
    # Hashed, immutable assets can be cached aggressively. This location has its
    # own add_header, so it must re-include the security headers.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached so new deploys are picked up immediately.
    # This is the document try_files falls back to, so the security headers MUST
    # be re-included here.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback — serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to dotfiles just in case.
    location ~ /\. {
        deny all;
    }
}
