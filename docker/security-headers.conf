# Security headers shared across locations.
#
# IMPORTANT: nginx does NOT inherit `add_header` directives from a parent block
# into any location that declares its own `add_header`. So this file is
# `include`d in every block that needs the headers (server-level + each caching
# location) to guarantee they are always present — especially on the index.html
# document that try_files serves.

# Content Security Policy — only what this Testnet dApp actually needs.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://horizon-testnet.stellar.org https://friendbot.stellar.org; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS only takes effect over HTTPS (browsers ignore it on plain HTTP).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
