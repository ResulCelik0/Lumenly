# Docker Compose for Lumenly.
#
#   make up     -> production build, served by hardened nginx on :8080
#   make dev    -> Vite dev server with hot reload on :5173
#
# The dev service is gated behind the "dev" profile so a plain `docker compose up`
# only starts the production container.

services:
  # ---- Production: static build behind hardened nginx ----------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumenly:latest
    container_name: lumenly
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---- Development: Vite dev server with hot reload ------------------------
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: lumenly-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
